---
# Distributes the secret files to the target hosts (mode 640, root:confluent).
#
# Usage (from the ansible/ directory):
#   ansible-playbook -i hosts.yml -e @vault.yml \
#     ../secrets/file-configprovider/distribute-secrets.yml
#
# The keystore/truststore passwords are cp-ansible's FIXED defaults — do not
# change them, or the keystore cannot be opened.

- name: Distribute broker secret files
  hosts: kafka_broker
  become: true
  gather_facts: false
  tasks:
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: /etc/kafka/secrets
        state: directory
        owner: root
        group: confluent
        mode: "0750"

    - name: Write broker secrets
      ansible.builtin.copy:
        dest: /etc/kafka/secrets/broker.properties
        owner: root
        group: confluent
        mode: "0640"
        content: |
          keystore.password=confluentkeystorestorepass
          truststore.password=confluenttruststorepass
          ldap.bind.password={{ vault_ldap_bind_password }}
      no_log: true

- name: Distribute Schema Registry secret files
  hosts: schema_registry
  become: true
  gather_facts: false
  tasks:
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: /etc/schema-registry/secrets
        state: directory
        owner: root
        group: confluent
        mode: "0750"

    - name: Write Schema Registry secrets
      ansible.builtin.copy:
        dest: /etc/schema-registry/secrets/sr.properties
        owner: root
        group: confluent
        mode: "0640"
        content: |
          keystore.password=confluentkeystorestorepass
          truststore.password=confluenttruststorepass
          kafkastore.password={{ vault_schema_registry_ldap_password }}
      no_log: true
