# Conjur policy — host identities and secrets for the Kafka components.
#
# DESIGN: each host may read ONLY its own secrets (least privilege). Even if a
# broker node is compromised, the other nodes' passwords remain out of reach.
#
# The host names must match the inventory_hostname values in hosts.yml
# EXACTLY — the broker authenticates as `host/{{ inventory_hostname }}`.
#
# Load with:  conjur policy load -b root -f kafka-secrets.yml

# =========================================================================
# Broker / controller nodes
# =========================================================================
- !host cp-node1
- !host cp-node2
- !host cp-node3

- !variable cp-node1/keystore-password
- !variable cp-node1/truststore-password
- !variable cp-node1/ldap-bind-password

- !variable cp-node2/keystore-password
- !variable cp-node2/truststore-password
- !variable cp-node2/ldap-bind-password

- !variable cp-node3/keystore-password
- !variable cp-node3/truststore-password
- !variable cp-node3/ldap-bind-password

- !permit
  role: !host cp-node1
  privileges: [read, execute]
  resource: !variable cp-node1/keystore-password
- !permit
  role: !host cp-node1
  privileges: [read, execute]
  resource: !variable cp-node1/truststore-password
- !permit
  role: !host cp-node1
  privileges: [read, execute]
  resource: !variable cp-node1/ldap-bind-password

- !permit
  role: !host cp-node2
  privileges: [read, execute]
  resource: !variable cp-node2/keystore-password
- !permit
  role: !host cp-node2
  privileges: [read, execute]
  resource: !variable cp-node2/truststore-password
- !permit
  role: !host cp-node2
  privileges: [read, execute]
  resource: !variable cp-node2/ldap-bind-password

- !permit
  role: !host cp-node3
  privileges: [read, execute]
  resource: !variable cp-node3/keystore-password
- !permit
  role: !host cp-node3
  privileges: [read, execute]
  resource: !variable cp-node3/truststore-password
- !permit
  role: !host cp-node3
  privileges: [read, execute]
  resource: !variable cp-node3/ldap-bind-password

# =========================================================================
# Schema Registry
# A separate identity from the node identities: even when SR runs on all
# three nodes, every instance shares this single identity (a component
# identity, not a machine identity).
# =========================================================================
- !host svc-kafka-schemaregistry

- !variable svc-kafka-schemaregistry/keystore-password
- !variable svc-kafka-schemaregistry/truststore-password
- !variable svc-kafka-schemaregistry/kafkastore-password

- !permit
  role: !host svc-kafka-schemaregistry
  privileges: [read, execute]
  resource: !variable svc-kafka-schemaregistry/keystore-password
- !permit
  role: !host svc-kafka-schemaregistry
  privileges: [read, execute]
  resource: !variable svc-kafka-schemaregistry/truststore-password
- !permit
  role: !host svc-kafka-schemaregistry
  privileges: [read, execute]
  resource: !variable svc-kafka-schemaregistry/kafkastore-password

# =========================================================================
# EXTENDING
#
# Kafka Connect, REST Proxy, Control Center and the KRaft controller are not
# covered here — their secrets remain in plaintext in the configuration files.
# To externalize them the pattern is identical to the above:
#
#   1) Add `- !host svc-kafka-connect` plus its variables and permits here
#   2) Populate the values with `conjur variable set`
#   3) Copy the provider JARs into the component's lib directory
#      (copy-cyberark-jars.yml)
#   4) Write the provider block and the `${cyberark:...}` references into
#      `<component>_custom_properties` in hosts.yml
#
# Note on the controller: it uses its own separate configuration file
# (/etc/controller/server.properties), not the broker's.
