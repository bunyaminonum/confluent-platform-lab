---
# Distributes the CyberArk ConfigProvider JARs onto the target components'
# classpaths.
#
# This is not cp-ansible's job — the provider is a third-party plugin. Without
# the JARs the service fails to start with
# "ClassNotFoundException: ...CyberArkConfigProvider".
#
# PREREQUISITE: download and extract the Confluent CSID CyberArk provider
# package. The actual JARs are NOT at the archive root but one level down,
# under lib/:
#   <extracted-dir>/confluentinc-csid-secrets-provider-cyberark-<version>/lib/*.jar
# Miss that distinction and the copy silently matches nothing — you only find
# out when the service refuses to start.
#
# Usage (from the ansible/ directory):
#   ansible-playbook -i hosts.yml ../secrets/cyberark-conjur/copy-cyberark-jars.yml \
#     -e "provider_lib_dir=/opt/cyberark-provider/.../lib"

- name: Distribute CyberArk ConfigProvider JARs
  hosts: kafka_broker:schema_registry
  become: true
  gather_facts: false

  vars:
    # Which component classpath each group maps to. A host belonging to both
    # groups receives the JARs in both locations.
    target_dirs:
      kafka_broker: /usr/share/java/kafka
      schema_registry: /usr/share/java/schema-registry

  pre_tasks:
    - name: Fail early if provider_lib_dir was not supplied
      ansible.builtin.assert:
        that:
          - provider_lib_dir is defined
          - provider_lib_dir | length > 0
        fail_msg: >-
          provider_lib_dir is not defined. Example:
          -e "provider_lib_dir=/opt/cyberark-provider/lib"

    - name: Verify the JARs actually exist on the control node
      ansible.builtin.find:
        paths: "{{ provider_lib_dir }}"
        patterns: "*.jar"
      register: provider_jars
      delegate_to: localhost
      become: false

    - name: Fail if the directory contained no JARs
      ansible.builtin.assert:
        that: provider_jars.matched > 0
        fail_msg: >-
          No .jar files found in {{ provider_lib_dir }}. Make sure you are
          pointing at the lib/ directory inside the extracted archive.

  tasks:
    - name: Copy provider JARs into component classpath
      ansible.builtin.copy:
        src: "{{ item.1.path }}"
        dest: "{{ target_dirs[item.0] }}/"
        mode: "0644"
      loop: "{{ group_names | intersect(target_dirs.keys() | list) | product(provider_jars.files) | list }}"
      loop_control:
        label: "{{ item.0 }} <- {{ item.1.path | basename }}"
      notify: restart affected services

  handlers:
    - name: restart affected services
      ansible.builtin.debug:
        msg: >-
          JARs updated. Restart the affected services:
          systemctl restart confluent-server confluent-schema-registry
