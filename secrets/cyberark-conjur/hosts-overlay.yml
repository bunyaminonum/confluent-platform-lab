---
# Blocks to be ADDED to hosts.yml — this file is not run on its own.
#
# 1) Copy cyberark_broker_props to the TOP of the
#    kafka_broker_custom_properties block (before the existing ldap.* lines).
# 2) In the same block, replace the ldap.java.naming.security.credentials line
#    with the ${cyberark:...} reference below.
# 3) Add the schema_registry_custom_properties block under all: vars:.
# 4) Add conjur_host_apikeys and vault_schemaregistry_conjur_apikey to vault.yml.

cyberark_broker_props:
  config.providers: cyberark
  config.providers.cyberark.class: io.confluent.csid.config.provider.cyberark.CyberArkConfigProvider
  config.providers.cyberark.param.cyberark.url: "https://{{ cp_infra_host }}:8443"
  config.providers.cyberark.param.cyberark.account: cplab
  config.providers.cyberark.param.cyberark.auth.username: "host/{{ inventory_hostname }}"
  # WARNING: this value CANNOT contain another ConfigProvider reference —
  # bootstrap parameters are read raw, BEFORE the ConfigTransformer engages.
  config.providers.cyberark.param.cyberark.auth.apikey: "{{ conjur_host_apikeys[inventory_hostname] }}"
  # Lab only. In PRODUCTION set this to true and add the Conjur CA to the
  # broker truststore.
  config.providers.cyberark.param.cyberark.ssl.verify.enabled: false

  ssl.key.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  ssl.keystore.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  confluent.metadata.server.ssl.key.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  confluent.metadata.server.ssl.keystore.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  confluent.metadata.server.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  kafka.rest.client.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  kafka.rest.confluent.metadata.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  listener.name.broker.ssl.key.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.broker.ssl.keystore.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.broker.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  listener.name.controller.ssl.key.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.controller.ssl.keystore.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.controller.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  listener.name.internal.ssl.key.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.internal.ssl.keystore.password: "${cyberark:{{ inventory_hostname }}/keystore-password:{{ inventory_hostname }}/keystore-password}"
  listener.name.internal.ssl.truststore.password: "${cyberark:{{ inventory_hostname }}/truststore-password:{{ inventory_hostname }}/truststore-password}"
  # LDAP bind password — REPLACES the existing line
  ldap.java.naming.security.credentials: "${cyberark:{{ inventory_hostname }}/ldap-bind-password:{{ inventory_hostname }}/ldap-bind-password}"

# Even when Schema Registry runs on all three nodes, every instance shares a
# SINGLE Conjur identity (a component identity, not a machine identity).
schema_registry_custom_properties:
  config.providers: cyberark
  config.providers.cyberark.class: io.confluent.csid.config.provider.cyberark.CyberArkConfigProvider
  config.providers.cyberark.param.cyberark.url: "https://{{ cp_infra_host }}:8443"
  config.providers.cyberark.param.cyberark.account: cplab
  config.providers.cyberark.param.cyberark.auth.username: "host/svc-kafka-schemaregistry"
  config.providers.cyberark.param.cyberark.auth.apikey: "{{ vault_schemaregistry_conjur_apikey }}"
  config.providers.cyberark.param.cyberark.ssl.verify.enabled: false
  ssl.key.password: "${cyberark:svc-kafka-schemaregistry/keystore-password:svc-kafka-schemaregistry/keystore-password}"
  ssl.keystore.password: "${cyberark:svc-kafka-schemaregistry/keystore-password:svc-kafka-schemaregistry/keystore-password}"
  ssl.truststore.password: "${cyberark:svc-kafka-schemaregistry/truststore-password:svc-kafka-schemaregistry/truststore-password}"
  confluent.metadata.ssl.truststore.password: "${cyberark:svc-kafka-schemaregistry/truststore-password:svc-kafka-schemaregistry/truststore-password}"
  kafkastore.ssl.truststore.password: "${cyberark:svc-kafka-schemaregistry/truststore-password:svc-kafka-schemaregistry/truststore-password}"
  kafkastore.sasl.jaas.config: >-
    org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
    username="svc-kafka-schemaregistry"
    password="${cyberark:svc-kafka-schemaregistry/kafkastore-password:svc-kafka-schemaregistry/kafkastore-password}"
    metadataServerUrls="{{ groups['kafka_broker'] | map('regex_replace', '^(.*)$', 'https://\1:8090') | join(',') }}";
