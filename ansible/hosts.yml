---
# =============================================================================
# Confluent Platform 8.3 — 3-node KRaft lab inventory (base installation)
#
# A single `confluent.platform.all` run deploys:
#   KRaft Controller + Broker + Schema Registry + Kafka Connect + REST Proxy
#   + Control Center Next Gen
#
# Security: TLS (self-managed CA) + Kerberos (server-to-server)
#           + RBAC/MDS/LDAP (client-facing)
#
# SECRETS: in this base installation passwords are encrypted at rest in Ansible
# Vault but are written in PLAINTEXT into the .properties files on the target
# hosts. To avoid that, apply one of the add-ons under ../secrets/ AFTER the
# installation completes — no reinstall required.
#
# >>> WHAT TO EDIT: the three blocks marked "### CHANGE ME".
# =============================================================================

all:
  vars:

    # =========================================================================
    ### CHANGE ME — 1/3: Environment identity
    # Everything else in this file derives from these values; do not hand-edit
    # the rest.
    # =========================================================================
    cp_domain: lab.local                      # DNS domain
    cp_realm: LAB.LOCAL                       # Kerberos realm (domain in UPPERCASE)
    cp_ldap_base: "dc=lab,dc=local"           # LDAP base DN
    cp_cluster_name: cp-lab                   # name shown in the MDS cluster registry
    cp_repo_dir: /opt/confluent-platform-lab  # path to this repo on the control node
    cp_infra_host: cp-node1                   # node hosting the package repo, KDC and LDAP

    # =========================================================================
    # Connection
    # =========================================================================
    deployment_strategy: rolling
    ansible_user: cloud-user
    ansible_become: true
    # cp-ansible 3.10+ requires Python 3.10 or newer. Use the real interpreter
    # path on the managed hosts.
    ansible_python_interpreter: /usr/bin/python3.11

    # =========================================================================
    # Air-gapped installation — packages come from a local HTTP repository
    # =========================================================================
    installation_method: package
    repository_configuration: custom
    custom_yum_repofile_filepath: "{{ cp_repo_dir }}/ansible/custom-confluent.repo"
    confluent_package_version: 8.3.0
    redhat_java_package_name: java-21-openjdk-headless

    # =========================================================================
    # TLS — self-managed Root CA
    # =========================================================================
    ssl_enabled: true
    ssl_mutual_auth_enabled: false
    ssl_custom_certs: true
    ssl_ca_cert_filepath: "{{ cp_repo_dir }}/pki/ca/ca.crt"
    ssl_signed_cert_filepath: "{{ cp_repo_dir }}/pki/certs/{{ inventory_hostname }}-signed.crt"
    ssl_key_filepath: "{{ cp_repo_dir }}/pki/certs/{{ inventory_hostname }}-key.pem"

    # =========================================================================
    # Server-to-server authentication — Kerberos / GSSAPI
    #
    # NOTE: `auth_mode: ldap` switches ONLY the client-facing 'internal'
    # listener to OAUTHBEARER. The inter-broker ('broker') and controller
    # listeners are separate blocks driven by the sasl_protocol variables
    # below. The two are independent.
    # =========================================================================
    sasl_protocol: kerberos
    kafka_controller_sasl_protocol: kerberos

    kerberos:
      realm: "{{ cp_realm }}"
      kdc_hostname: "{{ cp_infra_host }}"
      admin_hostname: "{{ cp_infra_host }}"
      dns_lookup_realm: false
      dns_lookup_kdc: false
      ticket_lifetime: 24h
      forwardable: true
      # Forces all Kerberos traffic over TCP, eliminating UDP packet-size
      # issues and firewall ambiguity.
      udp_preference_limit: 1
      default_tkt_enctypes: "aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128"
      default_tgs_enctypes: "aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128"
      permitted_enctypes: "aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128"
      canonicalize: false
      allow_weak_crypto: false

    # cp-ansible's kerberos role does NOT create principals or keytabs — it
    # copies an existing keytab to the target and writes krb5.conf. Creation is
    # covered in README step 6.
    kafka_broker_kerberos_principal: "kafka/{{ inventory_hostname }}.{{ cp_domain }}@{{ cp_realm }}"
    kafka_broker_kerberos_keytab_path: "{{ cp_repo_dir }}/pki/keytabs/{{ inventory_hostname }}-kafka_broker.keytab"
    kafka_controller_kerberos_principal: "kafka/{{ inventory_hostname }}.{{ cp_domain }}@{{ cp_realm }}"
    kafka_controller_kerberos_keytab_path: "{{ cp_repo_dir }}/pki/keytabs/{{ inventory_hostname }}-kafka_controller.keytab"

    # =========================================================================
    # RBAC + MDS + LDAP
    # =========================================================================
    rbac_enabled: true
    auth_mode: ldap
    mds_super_user: mds
    mds_super_user_password: "{{ vault_mds_super_user_password }}"

    # --- Broker / MDS ---
    kafka_broker_ldap_user: svc-kafka-broker
    kafka_broker_ldap_password: "{{ vault_kafka_broker_ldap_password }}"
    # CRITICAL: cp-ansible defaults this to an EMPTY STRING. Left empty, the
    # cluster never registers with the MDS cluster registry and does not appear
    # in Control Center — the deployment still finishes with failed=0 and no
    # warning is emitted.
    kafka_broker_cluster_name: "{{ cp_cluster_name }}"

    # --- Schema Registry ---
    schema_registry_ldap_user: svc-kafka-schemaregistry
    schema_registry_ldap_password: "{{ vault_schema_registry_ldap_password }}"
    schema_registry_cluster_name: "{{ cp_cluster_name }}-schema-registry"

    # --- Kafka Connect ---
    kafka_connect_ldap_user: svc-kafka-connect
    kafka_connect_ldap_password: "{{ vault_kafka_connect_ldap_password }}"
    kafka_connect_cluster_name: "{{ cp_cluster_name }}-connect"
    # NOTE: this is NOT the name Control Center displays — that comes from
    # kafka_connect_group_id (default "connect-cluster"). This value is used
    # only for the MDS registry entry.
    kafka_connect_custom_properties:
      # Lets connectors authenticate with their own identity instead of the
      # worker's. cp-ansible does not emit this automatically.
      connector.client.config.override.policy: All

    # --- REST Proxy ---
    # NOTE: there is no kafka_rest_cluster_name variable — REST Proxy does not
    # register with the MDS cluster registry and has no Control Center
    # integration.
    kafka_rest_ldap_user: svc-kafka-proxy
    kafka_rest_ldap_password: "{{ vault_kafka_rest_ldap_password }}"

    # --- Control Center ---
    control_center_next_gen_ldap_user: svc-kafka-controlcenter
    control_center_next_gen_ldap_password: "{{ vault_control_center_next_gen_ldap_password }}"
    # Alertmanager uses two ports: the web/API port (this variable) and a
    # cluster gossip port that is not configurable and lands on web port + 1.
    # The default 9093 collides with the KRaft controller listener; 9094 would
    # collide with its own gossip port.
    control_center_next_gen_dependency_alertmanager_port: 9195

    # =========================================================================
    # Broker configuration
    #
    # NOTE: keystore/truststore passwords are deliberately not set here —
    # cp-ansible uses its own fixed defaults and writes them into
    # server.properties in plaintext. The LDAP bind password is mandatory
    # because it authenticates against an external system.
    # To externalize these, see ../secrets/.
    # =========================================================================
    kafka_broker_custom_properties:
      # Kafka *data* directory — not a logging path. This is cp-ansible's own
      # baked-in default, made explicit so it doesn't have to be looked up.
      # DO NOT change this on a cluster that already has data: cp-ansible does
      # not migrate existing segments, and a mismatched path on restart can
      # orphan data or produce a fresh, empty log dir with a new cluster ID.
      # See "Custom log paths need an SELinux label" below before changing
      # kafka_broker_log_dir (a different, safe-to-change variable for
      # application/log4j logs, not this one).
      log.dirs: /var/lib/kafka/data

      # --- MDS's LDAP connection ---
      # PRODUCTION NOTE: the bind account below should be a dedicated,
      # read-only service account. Do NOT use the directory administrator
      # (cn=admin) — that identity is written into every broker's config file.
      ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
      ldap.com.sun.jndi.ldap.read.timeout: 3000
      ldap.java.naming.provider.url: "ldap://{{ cp_infra_host }}:1389"
      ldap.java.naming.security.principal: "cn=ldap-bind-user,{{ cp_ldap_base }}"
      ldap.java.naming.security.credentials: "{{ vault_ldap_bind_password }}"
      ldap.java.naming.security.authentication: simple
      ldap.user.search.base: "ou=users,{{ cp_ldap_base }}"
      ldap.user.name.attribute: uid
      ldap.user.object.class: inetOrgPerson
      ldap.search.mode: GROUPS
      ldap.group.search.base: "ou=groups,{{ cp_ldap_base }}"
      ldap.group.name.attribute: cn
      ldap.group.object.class: groupOfNames
      ldap.group.member.attribute: member
      ldap.group.member.attribute.pattern: "uid=(.*),ou=users,{{ cp_ldap_base }}"
      # For Active Directory: uid -> sAMAccountName, inetOrgPerson -> user,
      # groupOfNames -> group.

      # --- Durability ---
      default.replication.factor: 3
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      min.insync.replicas: 2
      auto.create.topics.enable: "false"

      # --- Performance (lab scale; tune to your workload in production) ---
      num.network.threads: 12
      num.io.threads: 16
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      connections.max.idle.ms: 14400000
      message.max.bytes: 33554816
      queued.max.requests: 1001
      max.connections.per.ip: 1500
      max.connections: 40000

      confluent.license: "{{ vault_confluent_license_key | default('') }}"

    # =========================================================================
    # Prometheus JMX Exporter — OFF by default
    #
    # Set jmxexporter_enabled: true to attach the JMX exporter Java agent to
    # every component. The ports below are then scraped by the Prometheus
    # instance in ../compose/ (monitoring profile). Full walkthrough:
    # ../monitoring/README.md
    #
    # PORTS ARE SET EXPLICITLY HERE ON PURPOSE. cp-ansible's default for the
    # broker exporter is 8080 — the same port this repository uses for the
    # air-gap package repository on cp_infra_host. Leaving the defaults in
    # place makes the broker fail to bind on that node. The 707x block below
    # is verified free and keeps every exporter in one predictable range.
    # =========================================================================
    jmxexporter_enabled: false
    # Air-gap: cp-ansible downloads the agent JAR from Maven Central by
    # default. Set this to false and place the JAR at jmxexporter_jar_path
    # yourself when the hosts have no internet access.
    jmxexporter_url_remote: true
    jmxexporter_jar_path: /opt/prometheus/jmx_prometheus_javaagent.jar

    kafka_controller_jmxexporter_port: 7071
    kafka_broker_jmxexporter_port: 7072      # cp-ansible default is 8080 — see note above
    schema_registry_jmxexporter_port: 7073
    kafka_connect_jmxexporter_port: 7074
    kafka_rest_jmxexporter_port: 7075

    # =========================================================================
    # Memory preflight override
    # cp-ansible's default thresholds exceed this lab's footprint.
    # Measured actual usage: controller ~1.3 GB, broker ~3.5 GB.
    # =========================================================================
    required_total_memory_mb_kafka_controller: 1500
    required_total_memory_mb_kafka_broker: 3500

  # ===========================================================================
  ### CHANGE ME — 2/3: Nodes
  # The inventory_hostname values must match the certificate and keytab
  # filenames exactly.
  # ===========================================================================
  hosts:
    cp-node1:
      ansible_connection: local              # the control node itself
    cp-node2:
      ansible_host: 10.0.0.2                 # << real IP
      ansible_ssh_private_key_file: ~/.ssh/cp-node2.key
    cp-node3:
      ansible_host: 10.0.0.3                 # << real IP
      ansible_ssh_private_key_file: ~/.ssh/cp-node3.key

# =============================================================================
# Component placement
#
# Schema Registry, Connect and REST Proxy run on all three nodes — running
# multiple instances forms a genuine cluster (SR leader election, Connect
# distributed workers, REST horizontal scaling). Control Center is a single
# instance.
# =============================================================================

kafka_controller:
  vars:
    kafka_controller_service_environment_overrides:
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    # cp-ansible's own default, made explicit — same caveat as the broker's
    # log.dirs above: only a single directory is allowed here (cp-ansible
    # asserts on this), and it must not change on a cluster with existing data.
    kafka_controller_custom_properties:
      log.dirs: /var/lib/controller/data
    # Application/log4j logs — safe to change, but read "Custom log paths need
    # an SELinux label" in the main README before pointing this outside
    # /var/log on an SELinux-enforcing host.
    kafka_controller_log_dir: /var/log/controller
  hosts:
    cp-node1:
    cp-node2:
    cp-node3:

kafka_broker:
  vars:
    kafka_broker_service_environment_overrides:
      KAFKA_HEAP_OPTS: "-Xms3g -Xmx3g"
    # cp-ansible's own default, made explicit. See the SELinux note in the
    # main README before moving this outside /var/log.
    kafka_broker_log_dir: /var/log/kafka

    # Reproduces cp-ansible's own default listener layout — nothing here
    # changes behaviour. Written out explicitly because the two names are
    # easy to mix up: INTERNAL (9092) is the CLIENT-FACING listener (despite
    # the name), authenticated per `auth_mode` above (OAUTHBEARER under
    # `ldap`); BROKER (9091) is the INTER-BROKER listener, Kerberos-only,
    # never exposed to clients. Per-component clients (Schema Registry,
    # Connect, REST Proxy, Control Center) each pick a listener via their own
    # `*_kafka_listener_name` variable, defaulting to `internal`.
    kafka_broker_custom_listeners:
      internal:
        name: INTERNAL
        port: 9092
        ssl_enabled: true
        ssl_mutual_auth_enabled: false
        ssl_client_authentication: none
        principal_mapping_rules: ["DEFAULT"]
        sasl_protocol: OAUTH
      broker:
        name: BROKER
        port: 9091
        ssl_enabled: true
        ssl_mutual_auth_enabled: false
        ssl_client_authentication: none
        principal_mapping_rules: ["DEFAULT"]
        sasl_protocol: kerberos
  hosts:
    cp-node1:
    cp-node2:
    cp-node3:

schema_registry:
  vars:
    schema_registry_service_environment_overrides:
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms512m -Xmx768m"
    # cp-ansible's own default, made explicit.
    schema_registry_log_dir: /var/log/confluent/schema-registry
  hosts:
    cp-node1:
    cp-node2:
    cp-node3:

kafka_connect:
  vars:
    kafka_connect_service_environment_overrides:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    # cp-ansible's own default is /var/log/kafka — the SAME directory as the
    # broker's log_dir above. Harmless in practice (log4j writes distinct
    # filenames, connect.log vs server.log) but confusing to grep through;
    # given its own directory here.
    kafka_connect_log_dir: /var/log/confluent/kafka-connect
    # /usr/share/java/connect_plugins is cp-ansible's default and ships empty.
    # FileStreamSourceConnector's JAR is real but lives in its own directory
    # (Confluent isolates file connectors — arbitrary host file read/write —
    # behind an explicit opt-in). Add it here to use it; see "FileStream
    # SourceConnector needs an explicit plugin path" in the main README.
    kafka_connect_plugins_path:
      - /usr/share/java/connect_plugins
      - /usr/share/filestream-connectors
  hosts:
    cp-node1:
    cp-node2:
    cp-node3:

kafka_rest:
  vars:
    kafka_rest_service_environment_overrides:
      KAFKAREST_HEAP_OPTS: "-Xms256m -Xmx512m"
    # cp-ansible's own default, made explicit.
    kafka_rest_log_dir: /var/log/confluent/kafka-rest
  hosts:
    cp-node1:
    cp-node2:
    cp-node3:

# ===========================================================================
### CHANGE ME — 3/3: Which node runs Control Center
# The most memory-hungry component; give it a dedicated node if you can.
# ===========================================================================
control_center_next_gen:
  vars:
    control_center_next_gen_service_environment_overrides:
      CONTROL_CENTER_HEAP_OPTS: "-Xmx3g"
    # cp-ansible's own default, made explicit.
    control_center_next_gen_log_dir: /var/log/confluent/control-center
  hosts:
    cp-node3:
